name: CI

# This repo is public and standalone (not part of oncall's internal ARC
# Kubernetes cluster) — standard GitHub-hosted runners, not arc-runner-set.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go generate (regenerate client from vendored swagger.json)
        run: go generate ./...

      - name: Fail if generated client is stale
        run: git diff --exit-code -- internal/client/client.gen.go

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

  docs-drift:
    runs-on: ubuntu-latest
    # tfplugindocs generates docs/ from schema descriptions + examples/. Fail
    # the build if someone changed a schema description or an example and
    # forgot to regenerate (see tfprovider-10-release.md in oncall's plan/).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go generate (tfplugindocs)
        run: go generate ./...

      - name: Fail if docs/ is stale
        run: git diff --exit-code -- docs/

  tofu-fmt:
    # observiply's HCL tooling is OpenTofu, not Terraform (see auth/tofu/) —
    # `fmt` is syntax-compatible either way, but use the CLI actually in use.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - name: tofu fmt -check
        run: tofu fmt -check -recursive examples/
