# GoReleaser config for the Terraform Registry publishing flow
# (tfprovider-10-release.md in oncall's plan/). Registry requirements this
# file exists to satisfy: standard platform matrix, SHA256SUMS + detached
# GPG signature, and zip archive naming the registry's protocol expects.
#
# Release workflow (.github/workflows/release.yml) invokes this via
# goreleaser/goreleaser-action, with GPG_PRIVATE_KEY / PASSPHRASE supplied
# from GitHub Actions secrets — see README.md "Releasing" for who owns that
# key and how it's rotated.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{.Version}} -X main.commit={{.Commit}}"
    goos:
      - freebsd
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - "386"
      - arm
      - arm64
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: freebsd
        goarch: arm64
    binary: "{{ .ProjectName }}_v{{ .Version }}"

archives:
  - format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

signs:
  - artifacts: checksum
    args:
      # goreleaser passes --output/${signature}, --detach-sign, etc. by
      # default; this matches the registry's documented gpg invocation.
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  extra_files:
    - glob: "terraform-registry-manifest.json"
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"

changelog:
  disable: true
